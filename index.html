<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Дурак Онлайн</title>
  
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    body { margin: 0; font-family: sans-serif; background: #18181b; color: white; user-select: none; }
    
    #login-screen { text-align: center; padding: 20px; max-width: 400px; margin: 0 auto; }
    .lobby-box { background: #27272a; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    h2 { margin-top: 0; font-size: 20px; color: #60a5fa; }
    
    input, select { padding: 12px; margin: 10px 0; display: block; border-radius: 6px; width: 100%; color: black; border: 1px solid #d4d4d8; font-size: 16px; box-sizing: border-box;}
    button { padding: 12px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: background 0.2s; }
    
    #game-screen { background: #065f46; min-height: 100vh; padding: 15px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box;}
    
    .card { background: white; color: black; padding: 16px 10px; margin: 4px; cursor: pointer; border-radius: 8px; font-weight: bold; font-size: 18px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: relative; min-width: 42px;}
    .card-back { background: #1e293b; color: #94a3b8; border: 2px solid #334155; cursor: default; font-size: 22px; padding: 12px 10px;}
    .selected { border: 3px solid #f59e0b; transform: translateY(-12px); }
    
    .suit-heart, .suit-diamond { color: #dc2626; }
    .suit-spade, .suit-club { color: #000000; }

    /* Стили для профилей ТГ */
    .tg-profile { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: bold; margin-bottom: 5px;}
    .tg-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 2px solid #34d399;}
    
    #opponents-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 10px; }
    .opponent-box { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; min-width: 120px; }
    .opponent-cards { margin-top: 5px; display: flex; justify-content: center; transform: scale(0.7); height: 50px; }

    .card-pair { display: inline-block; position: relative; width: 75px; height: 105px; margin: 10px 12px; vertical-align: top;}
    .attack-card { position: absolute; left: 0; top: 0; z-index: 1; }
    .defense-card { position: absolute; left: 16px; top: 16px; z-index: 2; box-shadow: -3px 3px 6px rgba(0,0,0,0.6); }

    #table-area { background: rgba(0, 0, 0, 0.15); min-height: 150px; border-radius: 12px; margin: 10px auto; padding: 15px; display: flex; justify-content: center; flex-wrap: wrap; align-items: center;}
    #info-bar { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 6px; font-size: 16px; font-weight: bold; margin-bottom: 10px; }
    .btn-action { background: #ea580c; padding: 12px; font-size: 16px; margin: 5px; width: auto; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div id="tg-user-info" class="tg-profile" style="margin-bottom: 20px; font-size: 18px;"></div>
    
    <div class="lobby-box">
      <h2>Создать комнату</h2>
      <select id="create-max-players"><option value="2">2 Игрока</option><option value="3">3 Игрока</option></select>
      <input type="text" id="create-room-input" placeholder="Код комнаты" />
      <button onclick="handleRoomAction('create')">Создать</button>
    </div>

    <div class="lobby-box">
      <h2>Войти по коду</h2>
      <input type="text" id="join-room-input" placeholder="Код от друга" />
      <button onclick="handleRoomAction('join')" style="background: #059669;">Войти</button>
    </div>
  </div>

  <div id="game-screen" style="display: none;">
    <div>
      <div id="info-bar">Подключение...</div>
      
      <button id="invite-btn" onclick="inviteFriend()" style="background: #0ea5e9; padding: 8px; margin-bottom: 10px; display: none;">✉️ Позвать друга в комнату</button>
      
      <div id="opponents-container"></div>
    </div>

    <div>
      <div id="trump-display" style="margin-bottom: 8px; font-weight: bold;"></div>
      <div id="table-area"></div>
      <div>
        <button id="btn-bito" class="btn-action" style="display:none;" onclick="sendRoundAction('bito')">✋ БИТО</button>
        <button id="btn-take" class="btn-action" style="display:none;" onclick="sendRoundAction('take')">🃏 ВЗЯТЬ КАРТЫ</button>
      </div>
    </div>

    <div id="player-area">
      <div id="my-profile" class="tg-profile" style="justify-content: flex-start; margin-left: 5px;"></div>
      <div id="cards-container"></div>
    </div>
  </div>

  <script>
    // ВСТАВЬ ССЫЛКУ НА СЕРВЕР RENDER
    const socket = io('https://durak-server-6wnc.onrender.com');
    
    // Настройки Telegram
    const tg = window.Telegram.WebApp;
    tg.expand(); // Открываем на весь экран
    
    // Получаем данные юзера из ТГ (если открыто не в ТГ, будут дефолтные)
    const tgUser = tg.initDataUnsafe?.user || { first_name: "Игрок с сайта", photo_url: "https://t4.ftcdn.net/jpg/00/64/67/63/360_F_64676383_LdbmhiNM6Ypzb3FM4PPuFP9rHe7ri8Ju.jpg" };
    
    // Показываем профиль в лобби
    document.getElementById('tg-user-info').innerHTML = `<img src="${tgUser.photo_url}" class="tg-avatar"> Привет, ${tgUser.first_name}!`;
    document.getElementById('my-profile').innerHTML = `<img src="${tgUser.photo_url}" class="tg-avatar"> ${tgUser.first_name} (Вы)`;

    let myId = '';
    let currentRoom = '';
    let selectedCard = null; 

    socket.on('connect', () => { myId = socket.id; });
    socket.on('gameState', (state) => { renderGameBoard(state); });

    function handleRoomAction(actionType) {
      let roomId = '';
      let maxPlayers = 2;

      if (actionType === 'create') {
        roomId = document.getElementById('create-room-input').value.trim();
        maxPlayers = document.getElementById('create-max-players').value;
      } else {
        roomId = document.getElementById('join-room-input').value.trim();
      }

      if (!roomId) return alert("Введите код!");

      currentRoom = roomId;
      // Отправляем данные ТГ на сервер
      socket.emit('joinRoom', { 
        roomId: currentRoom, 
        maxPlayers: maxPlayers,
        tgName: tgUser.first_name,
        tgPhoto: tgUser.photo_url
      });
      
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
    }

   // ФУНКЦИЯ ПРИГЛАШЕНИЯ (БЕЗ HTTP ССЫЛОК)
    function inviteFriend() {
      const text = Привет! Заходи играть со мной в Дурака!\n\n🤖 Бот: @Zetmod_bot\n🔑 Код нашей комнаты: ${currentRoom};
      // Оставляем только параметр text, чтобы не прикреплялась длинная ссылка
      const shareUrl = https://t.me/share/url?text=${encodeURIComponent(text)};
      tg.openTelegramLink(shareUrl);
    }
    function sendRoundAction(type) { socket.emit('action', { roomId: currentRoom, type: type }); }
    function getSuitSymbolClass(suit) { return (suit === '♥' || suit === '♦') ? 'suit-heart' : 'suit-spade'; }

    function renderGameBoard(state) {
      const myContainer = document.getElementById('cards-container');
      const tableArea = document.getElementById('table-area');
      const opponentsContainer = document.getElementById('opponents-container');
      const infoBar = document.getElementById('info-bar');
      const trumpDisplay = document.getElementById('trump-display');
      const inviteBtn = document.getElementById('invite-btn');
      
      myContainer.innerHTML = ''; tableArea.innerHTML = ''; opponentsContainer.innerHTML = '';

      if (state.status === 'waiting') {
        inviteBtn.style.display = 'inline-block'; // Показываем кнопку приглашения
      } else {
        inviteBtn.style.display = 'none'; // Скрываем, когда игра началась
      }

      const me = state.players.find(p => p.id === myId);
      if (!me) return;

      trumpDisplay.innerHTML = `Колода: ${state.deck.length} | Козырь: <span class="${getSuitSymbolClass(state.trump)}">${state.trump}</span>`;

      document.getElementById('btn-bito').style.display = (state.turn === myId && state.table.length > 0) ? 'inline-block' : 'none';
      document.getElementById('btn-take').style.display = (state.defender === myId && state.table.length > 0) ? 'inline-block' : 'none';

      if (state.status === 'waiting') {
         infoBar.innerText = `Ждем игроков... (${state.players.length}/${state.maxPlayers})`;
         infoBar.style.color = 'white';
      } else if (state.turn === myId) {
         infoBar.innerText = '⚔️ ВАШ ХОД!'; infoBar.style.color = '#4ade80';
      } else if (state.defender === myId) {
         infoBar.innerText = '🛡️ ОТБИВАЙТЕСЬ!'; infoBar.style.color = '#f87171';
      } else {
         infoBar.innerText = '👀 Ждем других...'; infoBar.style.color = '#94a3b8';
      }

      // Отрисовка соперников с АВАТАРКАМИ
      state.players.forEach(p => {
        if (p.id !== myId) {
          const opBox = document.createElement('div');
          opBox.className = 'opponent-box';
          
          let role = '';
          if (state.turn === p.id) role = '⚔️';
          if (state.defender === p.id) role = '🛡️';
          
          opBox.innerHTML = `
            <div class="tg-profile">
              <img src="${p.photo}" class="tg-avatar"> 
              <span>${p.name} ${role}</span>
            </div>
            <div style="font-size: 12px; color: #94a3b8;">Карт: ${p.hand.length}</div>
          `;
          
          const cardsPreview = document.createElement('div');
          cardsPreview.className = 'opponent-cards';
          for (let i = 0; i < p.hand.length; i++) {
            const b = document.createElement('div');
            b.className = 'card card-back'; b.innerText = '🂠';
            cardsPreview.appendChild(b);
          }
          opBox.appendChild(cardsPreview);
          opponentsContainer.appendChild(opBox);
        }
      });

      // Отрисовка стола
      state.table.forEach(pair => {
        const pairDiv = document.createElement('div');
        pairDiv.className = 'card-pair';

        const attDiv = document.createElement('div');
        attDiv.className = `card attack-card ${getSuitSymbolClass(pair.attack.suit)}`;
        attDiv.innerText = pair.attack.rank + pair.attack.suit;
        
        if (state.defender === myId && !pair.defense) {
          attDiv.onclick = () => {
            if (selectedCard) {
              socket.emit('defendCard', { roomId: currentRoom, cardId: pair.attack.id, withCard: selectedCard });
              selectedCard = null; 
            }
          };
        }
        pairDiv.appendChild(attDiv);

        if (pair.defense) {
          const defDiv = document.createElement('div');
          defDiv.className = `card defense-card ${getSuitSymbolClass(pair.defense.suit)}`;
          defDiv.innerText = pair.defense.rank + pair.defense.suit;
          pairDiv.appendChild(defDiv);
        }
        tableArea.appendChild(pairDiv);
      });

      // Твои карты
      me.hand.forEach(card => {
        const cardDiv = document.createElement('div');
        cardDiv.className = `card ${getSuitSymbolClass(card.suit)}`;
        cardDiv.innerText = card.rank + card.suit;
        
        if (selectedCard && selectedCard.id === card.id) cardDiv.classList.add('selected');

        cardDiv.onclick = () => {
          if (state.turn === myId) {
            socket.emit('attackCard', { roomId: currentRoom, card: card });
          } else if (state.defender === myId) {
            selectedCard = (selectedCard && selectedCard.id === card.id) ? null : card;
            renderGameBoard(state); 
          }
        };
        myContainer.appendChild(cardDiv);
      });
    }
  </script>
</body>
</html>
